<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note Strain</title>
<style>
:root {
  --bg: #0b0d10; --panel: #13161b; --line: #262b33; --grid: #1b1f25;
  --ink: #e3eaf5; --dim: #93a1b4; --faint: #5d6877; --accent: #f2c14e;
  --s1: #1d3557; --s2: #24508a; --s3: #2f6fb8; --s4: #5b9be0; --s5: #a9cff5;
  --phase-press: rgba(91, 155, 224, .22); --phase-hold: rgba(147, 161, 180, .14); --phase-release: rgba(242, 193, 78, .2);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, "Segoe UI", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; }
header { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
.stat { color: var(--dim); }
.stat b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
header label { color: var(--dim); display: flex; gap: 6px; align-items: center; margin-left: auto; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, auto) minmax(320px, 1fr); }
#scroll { overflow-y: auto; overflow-x: hidden; border-right: 1px solid var(--line); position: relative; }
#field { position: relative; }
.tick { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); color: var(--faint); font-size: 11px; padding-left: 4px; font-variant-numeric: tabular-nums; }
.lane-bg { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--grid); }
.note { position: absolute; border-radius: 3px; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; padding-bottom: 1px; }
.note.zero { background: transparent !important; border: 1px dashed var(--faint); color: var(--faint); }
.note.sel { outline: 2px solid var(--accent); outline-offset: 1px; z-index: 3; }
.band { position: absolute; pointer-events: none; z-index: 1; }
.win { position: absolute; background: var(--s3); border-radius: 0 3px 3px 0; opacity: .75; }
.win:hover { opacity: 1; }
.win.top { background: var(--accent); }
#tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); padding: 6px 8px; border-radius: 4px; font-size: 12px; display: none; z-index: 10; white-space: pre; font-variant-numeric: tabular-nums; }
aside { overflow-y: auto; padding: 14px 16px 40px; }
aside h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 18px 0 6px; }
aside h2:first-child { margin-top: 0; }
.big { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; }
.parts { display: flex; gap: 16px; color: var(--dim); }
.parts b { color: var(--ink); font-variant-numeric: tabular-nums; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th { color: var(--dim); font-weight: 500; }
th:first-child, td:first-child { text-align: left; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--panel); }
.ok { color: #7fd1a0; }
.bad { color: #ff7a7a; }
.muted { color: var(--dim); }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--dim); }
code { color: var(--ink); background: var(--panel); padding: 1px 4px; border-radius: 3px; }
.formula p { margin: 6px 0; color: var(--dim); }
.legend { display: flex; gap: 10px; align-items: center; color: var(--dim); font-size: 12px; flex-wrap: wrap; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; }
  #scroll { border-right: 0; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="stat">Lv <b id="level"></b></span>
  <span class="stat">difficulty <b id="difficulty"></b></span>
  <span class="stat">strain <b id="strain"></b></span>
  <span class="stat">rate <b id="rate"></b></span>
  <span class="stat" id="model"></span>
  <label>px/s <input id="zoom" type="range" min="80" max="1200" step="20" value="400"></label>
</header>
<main>
  <div id="scroll"><div id="field"></div></div>
  <aside id="side"></aside>
</main>
<div id="tip"></div>
<script>
const D = /*DATA*/null;
const LANE = 52, GUTTER = 44, WINW = 120, PAD = 60, NS = 1e6;
const $ = id => document.getElementById(id);
const fmt = (v, d = 3) => (Math.abs(v) < 1e-12 ? 0 : v).toFixed(d);
const o = D.options, rate = o.rate;
const total = c => c.movement + c.interaction + c.repeat;
const fingerName = i => `L${i + 1}` + (D.profile.fingers[i] ? (D.profile.fingers[i].hand ? "·R" : "·L") : "");
const notes = D.notes.map((n, i) => ({ ...n, i, strain: total(n.cost) }));
const playable = notes.filter(n => n.parts);
const chrono = [...playable].sort((a, b) => a.at - b.at || a.lane - b.lane);
const sorted = playable.map(n => n.strain).sort((a, b) => a - b);
const q = p => sorted.length ? sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))] : 0;
const cuts = [q(.2), q(.4), q(.6), q(.8)];
const step = v => 1 + cuts.filter(c => v > c).length;
const ink = s => s >= 4 ? "#0b0d10" : "#e3eaf5";

$("title").textContent = D.title;
$("level").textContent = D.level.toFixed(1);
$("difficulty").textContent = fmt(D.difficulty, 2);
$("strain").textContent = fmt(D.strain, 2);
$("rate").textContent = rate + "x";
$("model").textContent = D.model;

let zoom = 400, selected = null;
let t0 = Infinity, t1 = -Infinity;
for (const n of notes) { t0 = Math.min(t0, n.at); t1 = Math.max(t1, n.end); }
for (const w of D.windows) { t0 = Math.min(t0, w.at * rate); t1 = Math.max(t1, w.end * rate); }
if (!isFinite(t0)) { t0 = 0; t1 = 1000; }
t0 -= 200; t1 += 200;
// Time runs upward, as in play. y is the top edge of a source-time instant.
const y = t => PAD + (t1 - t) * zoom / 1000;
const played = ns => ns / NS * rate; // played-time ns -> source ms

function draw() {
  const f = $("field");
  f.innerHTML = "";
  const lanesW = GUTTER + D.lanes * LANE;
  f.style.width = (lanesW + 16 + WINW) + "px";
  f.style.height = (y(t0) + PAD) + "px";
  for (let s = Math.ceil(t0 / 1000); s * 1000 <= t1; s++) {
    const d = el("div", "tick", f); d.style.top = y(s * 1000) + "px"; d.textContent = s + "s";
  }
  for (let k = 0; k <= D.lanes; k++) {
    const d = el("div", "lane-bg", f); d.style.left = (GUTTER + k * LANE) + "px";
  }
  const top = Math.max(...D.windows.map(w => w.total), 1e-9);
  for (const w of D.windows) {
    const d = el("div", "win" + (w.rank <= 10 ? " top" : ""), f);
    d.style.left = (lanesW + 16) + "px";
    d.style.top = y(w.end * rate) + "px";
    d.style.height = Math.max(1, (w.end - w.at) * rate * zoom / 1000 - 2) + "px";
    d.style.width = Math.max(1, WINW * w.total / top) + "px";
    tip(d, () => `window ${fmt(w.at / 1000 * rate, 2)}s\ntotal ${fmt(w.total)}\nrank ${w.rank}  weight ${fmt(w.weight, 4)}\nweighted ${fmt(w.weighted)}`);
  }
  if (selected) bands(f, selected);
  for (const n of notes) {
    if (n.kind === "fake") continue;
    const head = 12;
    const d = el("div", "note", f);
    d.style.left = (GUTTER + n.lane * LANE + 3) + "px";
    d.style.width = (LANE - 6) + "px";
    d.style.top = (y(n.end) - (n.end > n.at ? 0 : head / 2)) + "px";
    d.style.height = (n.end > n.at ? (n.end - n.at) * zoom / 1000 + head / 2 : head) + "px";
    if (!n.parts) d.classList.add("zero");
    else { const s = step(n.strain); d.style.background = `var(--s${s})`; d.style.color = ink(s); }
    d.textContent = n.parts ? fmt(n.strain, 2) : n.kind;
    if (n === selected) d.classList.add("sel");
    d.onclick = () => select(n);
    tip(d, () => `#${n.i}  ${fingerName(n.lane)}  ${fmt(n.at / 1000, 3)}s\nM ${fmt(n.cost.movement)}  I ${fmt(n.cost.interaction)}  R ${fmt(n.cost.repeat)}`);
  }
}

// Phase bands: the time each part of the selected note's cost covers, in its finger's lane.
function bands(f, n) {
  for (const p of n.parts || []) {
    const d = el("div", "band", f);
    d.style.left = (GUTTER + p.finger * LANE) + "px";
    d.style.width = LANE + "px";
    d.style.top = y(played(p.end_ns)) + "px";
    d.style.height = Math.max(1, (played(p.end_ns) - played(p.at_ns)) * zoom / 1000) + "px";
    d.style.background = `var(--phase-${p.action === "rest" ? "hold" : p.action})`;
  }
}

function el(tag, cls, parent) { const e = document.createElement(tag); if (cls) e.className = cls; parent.appendChild(e); return e; }
function tip(e, text) {
  const t = $("tip");
  e.onmousemove = ev => { t.textContent = text(); t.style.display = "block"; t.style.left = (ev.clientX + 14) + "px"; t.style.top = (ev.clientY + 14) + "px"; };
  e.onmouseleave = () => { t.style.display = "none"; };
}

function select(n, scroll) {
  selected = n;
  history.replaceState(null, "", n ? "#" + n.i : location.pathname);
  draw();
  side();
  if (scroll) {
    const s = $("scroll");
    s.scrollTop = y(n.at) - s.clientHeight / 2;
  }
}

function share(a, b, aAction, bAction) {
  // Matrix rows are the lower finger's action; the share is the given finger's part.
  const lo = Math.min(a, b), hi = Math.max(a, b);
  const pair = D.profile.pairs.find(p => p.a === lo && p.b === hi);
  if (!pair) return null;
  const idx = { rest: 0, press: 1, hold: 2, release: 3 };
  const [ra, rb] = a === lo ? [aAction, bAction] : [bAction, aAction];
  const s = pair.costs[idx[ra]][idx[rb]];
  return a === lo ? s.a : s.b;
}

function side() {
  const n = selected, a = $("side");
  if (!n) { a.innerHTML = overview(); bindRows(a); return; }
  const f = D.profile.fingers[n.lane];
  const sameLane = chrono.filter(m => m.lane === n.lane);
  const at = sameLane.indexOf(n);
  const prev = sameLane[at - 1], next = sameLane[at + 1];
  let h = `<h2>#${n.i} · ${fingerName(n.lane)} · ${n.kind} · ${fmt(n.at / 1000, 3)}s</h2>
  <div class="big">${fmt(n.strain, 3)}</div>
  <div class="parts"><span>movement <b>${fmt(n.cost.movement)}</b></span><span>interaction <b>${fmt(n.cost.interaction)}</b></span><span>repeat <b>${fmt(n.cost.repeat)}</b></span></div>
  <p class="muted">같은 레인 간격: 이전 ${prev ? fmt((n.at - prev.at) / rate, 0) + "ms" : "–"} · 다음 ${next ? fmt((next.at - n.at) / rate, 0) + "ms" : "–"} (재생 시간)</p>`;

  // Movement: each phase is one reference movement times its speed factor.
  h += `<h2>movement = 기준 비용 × 속도 배수</h2><table><tr><th>동작</th><th>시간</th><th>기준</th><th>배수</th><th>기대</th><th>계산</th></tr>`;
  for (const action of ["press", "release"]) {
    const ps = n.parts.filter(p => p.action === action && p.finger === n.lane);
    if (!ps.length) continue;
    const start = Math.min(...ps.map(p => p.at_ns)), end = Math.max(...ps.map(p => p.end_ns));
    const ref = action === "press" ? f.press_ns : f.release_ns;
    const base = action === "press" ? f.press_cost : f.release_cost;
    const factor = Math.pow(Math.max(1, ref / (end - start)), o.speed_power);
    const got = ps.reduce((s, p) => s + p.cost.movement, 0);
    const ok = Math.abs(got - base * factor) < 1e-6 * Math.max(1, got);
    h += `<tr><td>${action}</td><td>${fmt((end - start) / NS, 1)}ms</td><td>${fmt(ref / NS, 0)}ms × ${base}</td><td>${fmt(factor, 3)}</td><td>${fmt(base * factor)}</td><td class="${ok ? "ok" : "bad"}">${fmt(got)}</td></tr>`;
  }
  h += `</table>`;

  // Interaction: the share this finger receives from each overlapping pair state.
  const inter = new Map();
  for (const p of n.parts) for (const x of p.interaction || []) {
    const key = `${x.finger}|${x.action}|${p.action}`;
    const e = inter.get(key) || { finger: x.finger, other: x.action, own: p.action, amount: 0, span: 0 };
    e.amount += x.amount; e.span += p.end_ns - p.at_ns;
    inter.set(key, e);
  }
  if (inter.size) {
    h += `<h2>interaction = 계수 × max(강도) × 시간</h2><table><tr><th>상대</th><th>내 동작</th><th>상대 동작</th><th>계수</th><th>겹침</th><th>비용</th></tr>`;
    for (const e of [...inter.values()].sort((a, b) => b.amount - a.amount)) {
      const s = share(n.lane, e.finger, e.own, e.other);
      h += `<tr><td>${fingerName(e.finger)}</td><td>${e.own}</td><td>${e.other}</td><td>${s == null ? "–" : s}</td><td>${fmt(e.span / NS, 1)}ms</td><td>${fmt(e.amount)}</td></tr>`;
    }
    h += `</table>`;
  }

  // Repeat: extra cost from this finger's accumulated load L.
  const rep = n.parts.filter(p => p.cost.repeat > 0);
  if (rep.length) {
    h += `<h2>repeat = 즉시 비용 × ${o.repeat_gain} × (L/${o.load_limit})²</h2><table><tr><th>구간</th><th>동작</th><th>L 시작</th><th>L 끝</th><th>비용</th></tr>`;
    for (const p of rep) h += `<tr><td>${fmt(played(p.at_ns) / 1000, 3)}–${fmt(played(p.end_ns) / 1000, 3)}s</td><td>${p.action}</td><td>${fmt(p.load_start)}</td><td>${fmt(p.load_end)}</td><td>${fmt(p.cost.repeat, 4)}</td></tr>`;
    h += `</table>`;
  }

  h += `<details><summary>모든 구간 ${n.parts.length}</summary><table><tr><th>재생 ms</th><th>손가락</th><th>동작</th><th>M</th><th>I</th><th>R</th></tr>`;
  for (const p of n.parts) h += `<tr><td>${fmt(p.at_ns / NS, 1)}–${fmt(p.end_ns / NS, 1)}</td><td>${fingerName(p.finger)}</td><td>${p.action}</td><td>${fmt(p.cost.movement, 4)}</td><td>${fmt(p.cost.interaction, 4)}</td><td>${fmt(p.cost.repeat, 4)}</td></tr>`;
  h += `</table></details>`;
  h += `<p class="muted" style="margin-top:14px">← → 시간순 이동 · Esc 개요</p>`;
  a.innerHTML = h;
}

function overview() {
  let h = `<h2>노트 strain</h2>
  <p class="muted">노트 하나가 받는 비용 = 그 손가락이 이 노트를 누르고·유지하고·떼는 동안의 movement + interaction + repeat. 쉬는 동안 남은 repeat은 직전 노트에 붙는다. 전체 합 = strain ${fmt(D.strain, 2)}. difficulty는 ${fmt(o.window_ns / NS, 0)}ms 창 합계를 내림차순 ${o.weight}ⁿ 가중한 값(오른쪽 막대, 상위 10개 강조)이라 노트 합과 다르다.</p>
  <div class="legend">${[1, 2, 3, 4, 5].map((s, i) => `<span><span class="sw" style="background:var(--s${s})"></span>${i ? "≤" + fmt(cuts[i] ?? sorted[sorted.length - 1] ?? 0, 2) : "≤" + fmt(cuts[0] ?? 0, 2)}</span>`).join("")}</div>
  <h2>상위 노트</h2><table><tr><th>#</th><th>시각</th><th>레인</th><th>M</th><th>I</th><th>R</th><th>합</th></tr>`;
  for (const n of [...playable].sort((a, b) => b.strain - a.strain).slice(0, 20))
    h += `<tr class="click" data-i="${n.i}"><td>${n.i}</td><td>${fmt(n.at / 1000, 2)}s</td><td>${fingerName(n.lane)}</td><td>${fmt(n.cost.movement, 2)}</td><td>${fmt(n.cost.interaction, 2)}</td><td>${fmt(n.cost.repeat, 2)}</td><td>${fmt(n.strain, 2)}</td></tr>`;
  h += `</table>
  <details class="formula"><summary>계산식과 설정</summary>
  <p><code>movement</code> 누름·뗌 하나 = 기준 비용 × max(1, 기준 시간 / 실제 시간)<sup>${o.speed_power}</sup>. 기준 시간 누름 ${fmt(D.profile.fingers[0].press_ns / NS, 0)}ms · 뗌 ${fmt(D.profile.fingers[0].release_ns / NS, 0)}ms. 다음 누름까지 시간이 모자라면 둘을 비율대로 줄인다. 탭은 최대 ${fmt(o.tap_hold_ns / NS, 0)}ms(또는 다음 노트 간격의 1/4) 머문 뒤 뗀다.</p>
  <p><code>interaction</code> 같은 손 두 손가락의 동작 조합마다 계수 × max(두 손가락의 동작 강도) × 겹친 시간. 강도 = 배수 / 동작 시간이라 동작 하나 전체에 걸쳐 적분하면 배수가 된다.</p>
  <p><code>repeat</code> 손가락별 부담 L: dL/dt = work·(1 − L/${o.load_limit}) − 회복·L. 쉬면 회복 1/${fmt(o.recovery_ns / NS, 0)}ms, 유지 중엔 ×${o.hold_recovery}, 움직이는 중엔 0. work에는 interaction이 ×${o.interaction_load}만 들어간다. 추가 비용률 = 즉시 비용률 × ${o.repeat_gain} × (L/${o.load_limit})².</p>
  <p>재생 속도 ${rate}x: 모든 동작 시간은 원본 시각 / ${rate}로 계산한다. 레벨 = round(difficulty) / 10.</p>
  <p class="muted">${D.notice}</p>
  </details>`;
  return h;
}

function bindRows(a) {
  for (const r of a.querySelectorAll("tr.click")) r.onclick = () => select(notes[+r.dataset.i], true);
}

$("zoom").oninput = e => {
  const s = $("scroll"), mid = t1 - (s.scrollTop + s.clientHeight / 2 - PAD) * 1000 / zoom;
  zoom = +e.target.value;
  draw();
  s.scrollTop = y(mid) - s.clientHeight / 2;
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { selected = null; history.replaceState(null, "", location.pathname); draw(); side(); return; }
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  e.preventDefault();
  const at = selected ? chrono.indexOf(selected) : -1;
  const next = chrono[Math.max(0, Math.min(chrono.length - 1, at + (e.key === "ArrowRight" ? 1 : -1)))];
  if (next) select(next, true);
});
// #264 opens with that note selected, so a note can be linked in a discussion.
const linked = notes[parseInt(location.hash.slice(1), 10)];
if (linked && linked.parts) select(linked, true);
else { draw(); side(); $("scroll").scrollTop = $("scroll").scrollHeight; }
</script>
</body>
</html>
